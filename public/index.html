<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Split — shared expenses</title>
<meta name="color-scheme" content="dark">
<link rel="icon" href="/logo.svg" type="image/svg+xml">
<style>
  :root { --bg: #1b1b1d; --panel: #232326; --text: #efeff1; --muted: #a9a9b0; --line: #36363b; --accent: #a3a8ff; --error: #ff9a9a; --good: #8fe0a8; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--muted); font: 15px/1.6 system-ui, sans-serif; }
  main { max-width: 560px; margin: 0 auto; padding: 32px 20px 64px; }
  h1 { color: var(--text); font-size: 26px; margin: 0 0 4px; }
  h1 img { vertical-align: -9px; margin-right: 10px; }
  h2 { color: var(--text); font-size: 15px; margin: 32px 0 8px; }
  a { color: var(--accent); }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  form { display: grid; gap: 10px; margin: 8px 0; }
  form.row { grid-template-columns: 1fr auto; align-items: end; }
  form.row3 { grid-template-columns: 2fr 1fr auto; align-items: end; }
  label { display: grid; gap: 4px; color: var(--text); font-size: 14px; }
  input { font: inherit; color: var(--text); background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; width: 100%; }
  button { font: inherit; color: #16162a; background: var(--accent); border: 0; border-radius: 8px; padding: 9px 14px; cursor: pointer; font-weight: 500; }
  button.quiet { background: none; color: var(--accent); padding: 0; font-weight: 400; text-decoration: underline; }
  ul { list-style: none; padding: 0; margin: 0; }
  li { display: flex; justify-content: space-between; gap: 12px; align-items: baseline; padding: 10px 0; border-bottom: 1px solid var(--line); }
  li small { display: block; }
  .text { color: var(--text); }
  .good { color: var(--good); }
  .bad { color: var(--error); }
  .top { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 16px; }
  #error { color: var(--error); min-height: 1.6em; margin: 8px 0 0; }
  code { color: var(--text); background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 1px 6px; }
</style>
</head>
<body>
<main>
  <p style="margin:0 0 16px"><a href="https://rehman20050409.github.io/projects.html" style="color:var(--muted);font-size:14px;text-decoration:none">← All projects</a></p>
  <div id="app"></div>
  <p id="error" role="alert"></p>
</main>
<script src="/app.js"></script>
</body>
</html>
